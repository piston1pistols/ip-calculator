<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator IP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 820px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size: 22px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border: none; background: #334155; color: #e2e8f0; border-radius: 8px; cursor: pointer; }
  .tab.active { background: #3b82f6; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .row.single { grid-template-columns: 1fr; }
  button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .results { margin-top: 20px; border-top: 1px solid #334155; padding-top: 16px; animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
  .result { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #1e293b; gap: 8px; animation: slideIn .25s ease; }
  @keyframes slideIn { from { opacity:0; transform: translateX(-6px);} to { opacity:1; transform: translateX(0);} }
  .result .k { color: #94a3b8; font-size: 13px; }
  .result .v { font-family: monospace; font-size: 14px; text-align: right; word-break: break-all; }
  .result .copy { background: #334155; color: #e2e8f0; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
  .result .copy:hover { background: #475569; }
  .err { color: #f87171; margin-top: 10px; font-size: 14px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .section { margin-top: 16px; }
  .section h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .bin { font-family: monospace; font-size: 13px; line-height: 1.6; word-break: break-all; }
  .bin .net { color: #60a5fa; font-weight: 700; }
  .bin .host { color: #fbbf24; }
  .bin .sep { color: #94a3b8; margin: 0 2px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .info-grid .result { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .badge.private { background: #1e3a5f; color: #60a5fa; }
  .badge.public { background: #1e3a2f; color: #34d399; }
  .badge.loop { background: #3a1e1e; color: #f87171; }
  .badge.mc { background: #3a2f1e; color: #fbbf24; }
  .badge.ll { background: #2f1e3a; color: #c084fc; }
  @media (max-width:600px){ .row{grid-template-columns:1fr;} .info-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="card">
  <h1>Kalkulator IP</h1>
  <div class="tabs">
    <button class="tab active" data-tab="v4">IPv4 / CIDR</button>
    <button class="tab" data-tab="v6">IPv6 / CIDR</button>
    <button class="tab" data-tab="conv">Konwersja</button>
  </div>

  <div id="v4" class="panel active">
    <div class="row">
      <div><label>Adres IP</label><input id="ip4" value="172.30.19.96"></div>
      <div><label>Prefix / maska</label><input id="mask4" value="28"></div>
    </div>
    <button id="btn4" onclick="calc4()">Oblicz</button>
    <div id="err4" class="err"></div>
    <div id="res4"></div>
  </div>

  <div id="v6" class="panel">
    <div class="row">
      <div><label>Adres IPv6</label><input id="ip6" value="2001:db8::1"></div>
      <div><label>Prefix</label><input id="mask6" value="64"></div>
    </div>
    <button onclick="calc6()">Oblicz</button>
    <div id="err6" class="err"></div>
    <div id="res6"></div>
  </div>

  <div id="conv" class="panel">
    <div class="row single">
      <div><label>Adres IP lub liczba</label><input id="convIn" value="192.168.1.1"></div>
    </div>
    <button onclick="calcConv()">Konwertuj</button>
    <div id="errC" class="err"></div>
    <div id="resC"></div>
  </div>
</div>

<script>
function ip4ToInt(ip){
  const parts = ip.split('.');
  if(parts.length !== 4) return null;
  let n = 0;
  for(const p of parts){
    if(!/^\d+$/.test(p)) return null;
    const v = +p;
    if(v < 0 || v > 255) return null;
    n = (n << 8) + v;
  }
  return n >>> 0;
}
function intToIp4(n){
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function maskFromPrefix(p){
  if(p < 0 || p > 32) return null;
  return p === 0 ? 0 : (~0 << (32-p)) >>> 0;
}
function copyVal(v){
  if(navigator.clipboard) navigator.clipboard.writeText(v);
}
function row(k,v,copyable=true){
  const c = copyable ? `<button class="copy" onclick="copyVal('${String(v).replace(/'/g,"\\'")}')">📋</button>` : '';
  return `<div class="result"><span class="k">${k}</span><span class="v">${v}</span>${c}</div>`;
}
function binaryHtml(n, prefix){
  const bits = n.toString(2).padStart(32,'0');
  let out = '';
  for(let i=0;i<32;i++){
    const cls = i < prefix ? 'net' : 'host';
    out += `<span class="${cls}">${bits[i]}</span>`;
    if(i === 7 || i === 15 || i === 23){
      if(i === prefix-1 || i+1 === prefix){ out += `<span class="sep">|</span>`; }
      out += '.';
    } else if(i === prefix-1 && prefix !== 8 && prefix !== 16 && prefix !== 24 && prefix !== 32){
      out += `<span class="sep">|</span>`;
    }
  }
  // ensure separator if prefix at octet boundary already handled by dot? add pipe before dot already? redo simpler:
  return out;
}
// simpler robust binary rendering
function binaryStr(n, prefix){
  const bits = n.toString(2).padStart(32,'0');
  let s = '';
  const chunks = [];
  for(let o=0;o<4;o++){
    const oct = bits.slice(o*8,(o+1)*8);
    let oStr = '';
    for(let i=0;i<8;i++){
      const gi = o*8+i;
      const cls = gi < prefix ? 'net' : 'host';
      oStr += `<span class="${cls}">${oct[i]}</span>`;
      if(gi === prefix-1 && prefix !== 32){
        oStr += `<span class="sep">|</span>`;
      }
    }
    chunks.push(oStr);
  }
  return chunks.join('<span class="sep">.</span>');
}

function classify(ipn){
  const o1 = (ipn>>>24)&255;
  const o2 = (ipn>>>16)&255;
  let type = 'Publiczny';
  let badge = 'public';
  if(o1 === 10){ type='Prywatny (RFC 1918)'; badge='private'; }
  else if(o1 === 172 && o2 >= 16 && o2 <= 31){ type='Prywatny (RFC 1918)'; badge='private'; }
  else if(o1 === 192 && o2 === 168){ type='Prywatny (RFC 1918)'; badge='private'; }
  else if(o1 === 127){ type='Loopback'; badge='loop'; }
  else if(o1 >= 224 && o1 <= 239){ type='Multicast'; badge='mc'; }
  else if(o1 === 169 && o2 === 254){ type='Link-Local (APIPA)'; badge='ll'; }
  let cls = '';
  if(o1 <= 127) cls='A';
  else if(o1 <= 191) cls='B';
  else if(o1 <= 223) cls='C';
  else if(o1 <= 239) cls='D';
  else cls='E';
  return {type, badge, cls};
}

function calc4(){
  const err = document.getElementById('err4'); err.textContent = '';
  const res = document.getElementById('res4'); res.innerHTML = '';
  const ip = document.getElementById('ip4').value.trim();
  let prefixRaw = document.getElementById('mask4').value.trim();
  const ipn = ip4ToInt(ip);
  if(ipn === null){ err.textContent = 'Błąd: Nieprawidłowy adres IPv4'; return; }
  let prefix;
  if(prefixRaw.includes('.')){
    const m = ip4ToInt(prefixRaw);
    if(m === null){ err.textContent = 'Błąd: Nieprawidłowa maska'; return; }
    prefix = (m.toString(2).match(/1/g)||[]).length;
    if(maskFromPrefix(prefix) !== m){ err.textContent = 'Błąd: Maska nieciągła'; return; }
  } else {
    if(!/^\d+$/.test(prefixRaw)){ err.textContent = 'Błąd: Nieprawidłowy prefiks'; return; }
    prefix = +prefixRaw;
  }
  if(isNaN(prefix) || prefix < 0 || prefix > 32){
    err.textContent = prefix > 32 ? 'Błąd: Maksymalny prefiks dla IPv4 to /32' : 'Błąd: Nieprawidłowy prefiks';
    return;
  }
  const mask = maskFromPrefix(prefix);
  const network = (ipn & mask) >>> 0;
  const broadcast = (network | (~mask >>> 0)) >>> 0;
  const hosts = prefix >= 31 ? (prefix === 31 ? 2 : 1) : (Math.pow(2, 32-prefix) - 2);
  const first = prefix >= 31 ? network : (network + 1) >>> 0;
  const last = prefix >= 31 ? broadcast : (broadcast - 1) >>> 0;
  const wildcard = (~mask) >>> 0;
  const info = classify(ipn);
  let html = '';
  html += `<div class="results">`;
  html += row('Sieć', intToIp4(network) + '/' + prefix);
  html += row('Maska', intToIp4(mask));
  html += row('Wildcard', intToIp4(wildcard));
  html += row('Broadcast', intToIp4(broadcast));
  html += row('Pierwszy host', intToIp4(first));
  html += row('Ostatni host', intToIp4(last));
  html += row('Liczba hostów', hosts);
  html += row('Zakres', intToIp4(first) + ' - ' + intToIp4(last));

  html += `<div class="section"><h3>Wizualizacja binarna</h3>`;
  html += `<div class="bin">IP:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${binaryStr(ipn, prefix)}</div>`;
  html += `<div class="bin">Maska:&nbsp;&nbsp;&nbsp;${binaryStr(mask, prefix)}</div>`;
  html += `<div class="bin">Sieć:&nbsp;&nbsp;&nbsp;&nbsp;${binaryStr(network, prefix)}</div>`;
  html += `<div class="bin">Broadcast: ${binaryStr(broadcast, prefix)}</div>`;
  html += `<div class="bin">Wildcard:&nbsp;${binaryStr(wildcard, prefix)}</div>`;
  html += `</div>`;

  html += `<div class="section"><h3>Informacje</h3>`;
  html += `<div class="info-grid">`;
  html += row('Typ adresu', `<span class="badge ${info.badge}">${info.type}</span>`, false);
  html += row('Klasa historyczna', 'Klasa ' + info.cls, false);
  html += row('Prywatny?', (info.badge==='private')?'Tak':'Nie', false);
  html += `</div></div>`;
  html += `</div>`;
  res.innerHTML = html;
}

function ip6ToInts(ip){
  if(ip.includes('::')){
    const parts = ip.split('::');
    if(parts.length > 2) return null;
    const left = parts[0] ? parts[0].split(':') : [];
    const right = parts[1] ? parts[1].split(':') : [];
    const total = left.length + right.length;
    if(total > 8) return null;
    const zeros = 8 - total;
    const groups = [...left, ...Array(zeros).fill('0'), ...right];
    if(groups.length !== 8) return null;
    const out = [];
    for(const g of groups){
      if(!/^[0-9a-fA-F]{0,4}$/.test(g)) return null;
      out.push(parseInt(g || '0', 16));
    }
    return out;
  }
  const parts = ip.split(':');
  if(parts.length !== 8) return null;
  const out = [];
  for(const g of parts){
    if(!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
    out.push(parseInt(g, 16));
  }
  return out;
}
function calc6(){
  const err = document.getElementById('err6'); err.textContent = '';
  const res = document.getElementById('res6'); res.innerHTML = '';
  const ip = document.getElementById('ip6').value.trim();
  const prefix = +document.getElementById('mask6').value.trim();
  const groups = ip6ToInts(ip);
  if(!groups){ err.textContent = 'Błąd: Nieprawidłowy adres IPv6'; return; }
  if(isNaN(prefix) || prefix < 0 || prefix > 128){
    err.textContent = prefix > 128 ? 'Błąd: Maksymalny prefiks dla IPv6 to /128' : 'Błąd: Nieprawidłowy prefiks';
    return;
  }
  let n = 0n;
  for(const g of groups) n = (n << 16n) + BigInt(g);
  let mask = 0n;
  if(prefix > 0) mask = ((1n << 128n) - 1n) ^ ((1n << BigInt(128-prefix)) - 1n);
  const network = n & mask;
  const broadcast = network | (~mask & ((1n<<128n)-1n));
  function toIp6(big){
    const groups = [];
    let x = big;
    for(let i=0;i<8;i++){ groups.unshift(Number(x & 0xffffn)); x >>= 16n; }
    return groups.map(g=>g.toString(16)).join(':');
  }
  const hosts = prefix === 128 ? 1n : (prefix === 127 ? 2n : (1n << BigInt(128-prefix)) - 2n);
  const first = prefix >= 127 ? network : network + 1n;
  const last = prefix >= 127 ? broadcast : broadcast - 1n;
  let html = `<div class="results">`;
  html += row('Sieć', toIp6(network) + '/' + prefix);
  html += row('Pierwszy host', toIp6(first));
  html += row('Ostatni host', toIp6(last));
  html += row('Broadcast/ostatni', toIp6(broadcast));
  html += row('Liczba hostów', hosts.toString());
  html += `</div>`;
  res.innerHTML = html;
}

function calcConv(){
  const err = document.getElementById('errC'); err.textContent = '';
  const res = document.getElementById('resC'); res.innerHTML = '';
  const v = document.getElementById('convIn').value.trim();
  const rows = [];
  const n4 = ip4ToInt(v);
  if(n4 !== null){
    rows.push(['IPv4', v]);
    rows.push(['Dziesiętny', n4]);
    rows.push(['Hex', '0x' + n4.toString(16).toUpperCase()]);
    rows.push(['Binarny', n4.toString(2).padStart(32,'0')]);
    rows.push(['IPv6 (zmapowany)', '::ffff:' + v]);
  } else if(/^\d+$/.test(v)){
    const n = +v;
    if(n >= 0 && n <= 0xFFFFFFFF){
      rows.push(['Dziesiętny', n]);
      rows.push(['IPv4', intToIp4(n>>>0)]);
      rows.push(['Hex', '0x' + n.toString(16).toUpperCase()]);
      rows.push(['Binarny', n.toString(2).padStart(32,'0')]);
    } else { err.textContent = 'Błąd: Liczba poza zakresem IPv4'; return; }
  } else {
    const groups = ip6ToInts(v);
    if(groups){
      let n = 0n;
      for(const g of groups) n = (n << 16n) + BigInt(g);
      rows.push(['IPv6', v]);
      rows.push(['Hex (pełny)', groups.map(g=>g.toString(16).padStart(4,'0')).join(':')]);
      rows.push(['Binarny', n.toString(2).padStart(128,'0')]);
      rows.push(['Dziesiętny', n.toString()]);
    } else { err.textContent = 'Błąd: Nieprawidłowy adres'; return; }
  }
  res.innerHTML = `<div class="results">${rows.map(r=>row(r[0],r[1])).join('')}</div>`;
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  });
});
calc4();
</script>
</body>
</html>
